name: Bug report
description: Report something broken in Throughline.
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail to reproduce it.

  - type: dropdown
    id: view
    attributes:
      label: Which view?
      options:
        - Canvas view (Chrome 157+)
        - Canvas view (older Chromium with the flag)
        - Flat fallback
        - Compact view
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 157.0.0.0 on macOS 15
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo in Chrome 157.
        2. Press Present.
        3. Press ArrowRight.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser console.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here if the issue is visual.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed any secrets or private data from this report.
          required: true
